name: Build VaultStream-Packer.exe (Windows Release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies & PyInstaller
        working-directory: packer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build VaultStream-Packer.exe
        working-directory: packer
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "VaultStream-Packer" --collect-all "googleapiclient" --collect-all "google_auth_oauthlib" --collect-all "cryptography" gui_app.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultStream-Packer-Windows
          path: packer/dist/VaultStream-Packer.exe

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packer/dist/VaultStream-Packer.exe
          generate_release_notes: true
